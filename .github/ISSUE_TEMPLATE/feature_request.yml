name: Feature request
description: Suggest a new capability for CaseON
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? What is the use case?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Sketch the API or behavior you have in mind.
      render: csharp
    validations:
      required: false
